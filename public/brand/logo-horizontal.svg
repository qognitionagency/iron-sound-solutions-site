<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 541 68" width="541" height="68" role="img" aria-labelledby="iss-h-title">
  <title id="iss-h-title">Iron Sound Solutions</title>
  <!--
    Horizontal lockup. All letterforms are drawn paths (no font dependency).
    Wordmark grid: cap height 40, stem 8 (20% of cap = ExtraBold, expanded).
    Mark height = full wordmark block (IRON SOUND cap top to SOLUTIONS baseline).
    SOLUTIONS: cap 11, stroke 2.2, tracked ~0.5em, centred, flanked by brass hairlines
    that run to the full measure of IRON SOUND.
    Clear space: keep 1x the I-stem-to-R gap (approx. 0.5 x mark width) free on all sides.
